name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo || grep -m1 'CPU part' /proc/cpuinfo || true
          grep -m1 -o 'avx2\|avx512_vnni\|avx512bw\|avx512f\|i8mm\|asimddp' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      - run: go vet ./...
      - run: go test -v -run TestEncodeSyntheticKernels ./... | grep kernel=
      - run: go test ./...
      - name: Go fallback paths
        run: MODERNBERT_KERNEL=none go test ./...
      - name: AVX2 kernels where the CPU has AVX-512
        if: matrix.arch == 'amd64'
        run: MODERNBERT_KERNEL=avx2 go test ./...
      - name: Kernel benchmarks
        run: go test -run NONE -bench 'BenchmarkEncodeSynthetic|BenchmarkTileGemm' -benchtime 2x ./...
      - name: Kernel benchmarks, all cores
        run: MODERNBERT_THREADS=4 go test -run NONE -bench 'BenchmarkEncodeSynthetic' -benchtime 2x ./...
